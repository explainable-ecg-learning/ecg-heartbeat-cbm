services:
  explorer:
    build:
      context: ..
      dockerfile: explorer/Dockerfile
      args:
        TORCH_VERSION: "2.5.1"
        TORCH_INDEX_URL: "${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}"
    image: ecg-heartbeat-cbm-explorer:latest
    container_name: ecg-cbm-explorer
    ports:
      - "${EXPLORER_HOST:-127.0.0.1}:${EXPLORER_PORT:-8040}:8040"
    environment:
      ECG_DATA_DIR: /data
      ECG_DATA_PATH: "${ECG_DATA_PATH:-ptb-xl}"
      ECG_RUNS_DIR: /app/models
      ECG_DELIN_CACHE_DIR: /app/delineation_cache
      ECG_DEFAULT_RUN: "${ECG_DEFAULT_RUN:-cem_softseg}"
    volumes:
      - "${ECG_DATA_DIR:-/nfs/data8/schlegel/git/ecg-cbm/data}:/data:ro"
      - "../models:/app/models:ro"
      - "../checkpoints/dataset_cache/delineation:/app/delineation_cache:ro"
    restart: unless-stopped
