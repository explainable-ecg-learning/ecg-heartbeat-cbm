<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECG Heartbeat CBM Explorer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>ECG Heartbeat CBM Explorer</h1>
    <p class="subtitle">Concept Bottleneck Model — sliding-window concept activation explorer</p>
  </header>

  <main>
    <!-- ── Controls ─────────────────────────────────────────────────────── -->
    <section class="controls card">
      <div class="control-row">
        <label for="record-select">PTB-XL Record</label>
        <select id="record-select"><option value="">— loading records… —</option></select>
        <button id="load-btn" class="primary-btn">Load Record</button>
      </div>
      <div class="control-row">
        <label for="lead-select">Display Lead</label>
        <select id="lead-select">
          <option value="1" selected>II</option>
          <option value="0">I</option>
          <option value="2">III</option>
          <option value="3">aVR</option>
          <option value="4">aVL</option>
          <option value="5">aVF</option>
          <option value="6">V1</option>
          <option value="7">V2</option>
          <option value="8">V3</option>
          <option value="9">V4</option>
          <option value="10">V5</option>
          <option value="11">V6</option>
        </select>
        <label for="stride-input" style="margin-left:1.5rem">Sweep stride (samples)</label>
        <input id="stride-input" type="number" value="25" min="5" max="250" style="width:70px" />
        <button id="sweep-btn" class="secondary-btn">Pre-compute sweep</button>
        <span id="sweep-status" class="status-label"></span>
      </div>
    </section>

    <!-- ── Signal + window ───────────────────────────────────────────────── -->
    <section class="card" id="signal-section">
      <h2>ECG Signal <span id="record-meta" class="meta-label"></span></h2>
      <div id="signal-hint" class="hint">Load a record to begin.</div>
      <div id="signal-container"></div>
    </section>

    <!-- ── Model pipeline ───────────────────────────────────────────────── -->
    <section class="card" id="pipeline-section" style="display:none">
      <h2>Model Pipeline <span class="window-info" id="window-pos-label"></span></h2>
      <div class="pipeline">

        <!-- 1. Input window -->
        <div class="pipe-panel pipe-panel--input">
          <div class="pipe-panel-title">Input Window</div>
          <div id="window-plot"></div>
        </div>

        <!-- Connector: Encoder -->
        <div class="pipe-connector">
          <svg class="pipe-sym" viewBox="0 0 64 84" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polyline points="2,11 8,4 14,13 20,6 26,12 32,4 38,12 44,6 50,11 56,7 62,11"
              stroke="#38bdf8" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
            <rect x="5"  y="17" width="54" height="6" rx="2" fill="#38bdf8" opacity="0.3"/>
            <rect x="10" y="27" width="44" height="6" rx="2" fill="#38bdf8" opacity="0.45"/>
            <rect x="16" y="37" width="32" height="6" rx="2" fill="#38bdf8" opacity="0.62"/>
            <rect x="22" y="47" width="20" height="6" rx="2" fill="#38bdf8" opacity="0.8"/>
            <line x1="32" y1="53" x2="32" y2="62" stroke="#475569" stroke-width="1.5"/>
            <rect x="14" y="62" width="36" height="10" rx="2" fill="#0ea5e9" opacity="0.75"/>
            <text x="32" y="70" text-anchor="middle" fill="#e2e8f0" font-size="5.5" font-family="monospace">z ∈ ℝ⁵¹²</text>
          </svg>
          <div class="pipe-arrow-row">
            <div class="pipe-arrow-line"></div>
            <span class="pipe-arrow-tip">▶</span>
          </div>
          <div class="pipe-label">Encoder</div>
        </div>

        <!-- 2. Concept activations -->
        <div class="pipe-panel pipe-panel--concepts">
          <div class="pipe-panel-title">Concept Activations (C)</div>
          <div id="histogram-container"></div>
        </div>

        <!-- Connector: Predictor -->
        <div class="pipe-connector">
          <svg class="pipe-sym" viewBox="0 0 64 84" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="10" cy="10" r="3.5" fill="#a78bfa" opacity="0.6"/>
            <circle cx="10" cy="22" r="3.5" fill="#a78bfa" opacity="0.6"/>
            <circle cx="10" cy="34" r="3.5" fill="#a78bfa" opacity="0.6"/>
            <circle cx="10" cy="46" r="3.5" fill="#a78bfa" opacity="0.6"/>
            <circle cx="10" cy="58" r="3.5" fill="#a78bfa" opacity="0.6"/>
            <circle cx="10" cy="70" r="3.5" fill="#a78bfa" opacity="0.6"/>
            <line x1="13.5" y1="10" x2="48" y2="40" stroke="#a78bfa" stroke-width="0.8" opacity="0.3"/>
            <line x1="13.5" y1="22" x2="48" y2="40" stroke="#a78bfa" stroke-width="0.8" opacity="0.35"/>
            <line x1="13.5" y1="34" x2="48" y2="40" stroke="#a78bfa" stroke-width="1"   opacity="0.5"/>
            <line x1="13.5" y1="46" x2="48" y2="40" stroke="#a78bfa" stroke-width="1"   opacity="0.5"/>
            <line x1="13.5" y1="58" x2="48" y2="40" stroke="#a78bfa" stroke-width="0.8" opacity="0.35"/>
            <line x1="13.5" y1="70" x2="48" y2="40" stroke="#a78bfa" stroke-width="0.8" opacity="0.3"/>
            <circle cx="54" cy="40" r="8" fill="#a78bfa" opacity="0.9"/>
            <text x="54" y="43.5" text-anchor="middle" fill="#fff" font-size="9">σ</text>
            <text x="54" y="57" text-anchor="middle" fill="#94a3b8" font-size="6" font-family="monospace">p(y)</text>
          </svg>
          <div class="pipe-arrow-row">
            <div class="pipe-arrow-line"></div>
            <span class="pipe-arrow-tip">▶</span>
          </div>
          <div class="pipe-label">Predictor</div>
        </div>

        <!-- 3. Task prediction -->
        <div class="pipe-panel pipe-panel--task">
          <div class="pipe-panel-title">Task Prediction</div>
          <div id="task-pred-container"></div>
        </div>

      </div>
    </section>

    <!-- ── Sweep heatmap ─────────────────────────────────────────────────── -->
    <section class="card" id="sweep-section" style="display:none">
      <h2>Sweep — Concept Activations over Time</h2>
      <div id="heatmap-container"></div>
    </section>
  </main>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
